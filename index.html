<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4efe9;
      font-family: 'Amiri', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 40px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      border: 2px solid #d4af37;
      text-align: center;
      position: relative;
      animation: fadeIn 1.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .verse {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 25px;
      font-style: italic;
    }

    .title {
      font-family: 'Reem Kufi', sans-serif;
      color: #d4af37;
      font-size: 1.8rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .names {
      font-size: 2rem;
      color: #2c3e50;
      font-weight: bold;
      margin: 25px 0;
      line-height: 1.5;
    }

    .heart {
      color: #e74c3c;
      display: inline-block;
      animation: pulse 1.5s infinite;
      margin: 0 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .details {
      color: #666;
      font-size: 1.1rem;
      line-height: 2;
      margin-top: 20px;
      border-top: 1px baseline #eee;
      padding-top: 20px;
    }

    .footer-text {
      margin-top: 25px;
      font-size: 1.2rem;
      color: #d4af37;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="verse">
      "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً"
    </div>

    <div class="title">دعوة لحضور زفاف نجلينا</div>

    <div class="names">
      العريس <span class="heart">♥</span> العروس
    </div>

    <div class="details">
      يسرنا بحضوركم إتمام فرحتنا<br>
      وتكتمل مسرتنا بنجلينا
    </div>

    <div class="footer-text">
      أهلاً وسهلاً بالجميع
    </div>
  </div>

</body>
  </html>
